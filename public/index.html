<!--
  index.html
  Simple frontend form for AI-Assisted Content Publisher
  Encoding: UTF-8
  Author: abkh
  Date: May 2024
  Description: This HTML file provides a user interface for submitting articles to the AI-assisted content publisher. 
  It includes a title and content input field, a submit button, and displays the generated summary or error messages.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI-Assisted Content Publisher</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 10px; }
    textarea, input { width: 100%; margin-top: 10px; padding: 8px; font-size: 1em; }
    button { padding: 10px 15px; margin-top: 10px; font-size: 1em; }
    #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>AI-Assisted Article Submission</h2>
  
  <label for="title">Title:</label>
  <input type="text" id="title" placeholder="Enter article title">

  <label for="content">Content:</label>
  <textarea id="content" rows="8" placeholder="Write your article here..."></textarea>

  <button onclick="submitArticle()">Submit Article</button>

  <div id="result"></div>

  <script>
    async function submitArticle() {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      const response = await fetch("http://localhost:3000/articles", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content })
      });

      const resultDiv = document.getElementById("result");
      const data = await response.json();

      if (response.ok) {
        resultDiv.innerHTML = `
          <h3>Summary Generated:</h3>
          <p><strong>Title:</strong> ${data.article.title}</p>
          <p><strong>Summary:</strong> ${data.article.summary}</p>
        `;
      } else {
        resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error || 'Something went wrong.'}</p>`;
      }
    }
  </script>
</body>
</html>
