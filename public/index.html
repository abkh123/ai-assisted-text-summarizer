<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI-Assisted Content Publisher</title>
  <!-- <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 10px; }

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
    }
  
    .container {
      padding: 30px 5%;
    }
  
    h2 {
      margin-bottom: 10px;
    }
  
    textarea, input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 1em;
      box-sizing: border-box;
    }
  
    button {
      padding: 12px 20px;
      margin-top: 10px;
      font-size: 1em;
      cursor: pointer;
    }
  
    #result {
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>AI Text Summarizer</h2>

    <label for="content">Enter any text:</label>
    <textarea id="content" rows="12" placeholder="Paste or write something you'd like summarized..."></textarea>

    <button onclick="submitArticle()">Submit Article</button>

    <div id="result"></div>
  </div>

  <script>
    async function submitArticle() {
      const content = document.getElementById("content").value;

      const response = await fetch("http://localhost:3000/articles", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: "Untitled", content })
      });

      const resultDiv = document.getElementById("result");
      const data = await response.json();

      if (response.ok) {
        let warningMessage = "";
        if (data.truncated) {
          warningMessage = `<p style="color: orange;"><strong>⚠️ Note:</strong> Your input was too long and was truncated before summarization.</p>`;
        }

        resultDiv.innerHTML = `
          ${warningMessage}
          <h3>Summary:</h3>
          <p><strong>Title:</strong> ${data.article.title}</p>
          <p><strong>Summary:</strong> ${data.article.summary}</p>
        `;
      } else {
        resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error || 'Something went wrong.'}</p>`;
      }
    }
  </script>
</body>
</html>
